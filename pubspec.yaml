name: exam_guard
description: ExamGuard - 감독관 휴대폰으로 시험장 내 숨긴 무선기기(BLE/Wi-Fi)를 자리 단위로 추적하는 오픈소스 앱
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  wifi_scan: ^0.4.1
  permission_handler: ^11.3.0
  sensors_plus: ^6.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
